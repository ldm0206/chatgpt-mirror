name: 构建并发布镜像

on:
  push:
    # 每次提交都构建；main 分支额外打 latest
    branches:
      - "**"
    # 打 tag（v1.2.3）时发布语义化版本标签
    tags:
      - "v*"
  workflow_dispatch:

# 同一分支有新提交时取消尚未结束的旧构建，避免堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 对应仓库 ldm0206/chatgpt-mirror，最终镜像名为 ghcr.io/ldm0206/chatgpt-mirror/backend
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    name: 构建 backend 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 多架构（amd64/arm64）构建需要 QEMU 模拟
      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest 只由下面的条件手动生成，避免 tag 推送时意外覆盖
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 老版本 Docker/Compose 拉取多架构镜像时可能无法解析 attestation 清单，直接关掉
          provenance: false
          platforms: linux/amd64,linux/arm64

  build-and-push-frontend:
    name: 构建 frontend 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # 在闭源网关镜像之上覆盖本仓库的管理台前端，最终镜像名 ghcr.io/ldm0206/chatgpt-mirror/frontend
      IMAGE_NAME: ${{ github.repository }}/frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 产物输出到 gateway/static，供下面的镜像构建 COPY
      - name: 构建管理台前端
        working-directory: frontend
        run: npm ci && npm run build

      # 多架构（amd64/arm64）构建需要 QEMU 模拟
      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest 只由下面的条件手动生成，避免 tag 推送时意外覆盖
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 老版本 Docker/Compose 拉取多架构镜像时可能无法解析 attestation 清单，直接关掉
          provenance: false
          platforms: linux/amd64,linux/arm64
